[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sciqnt-fx-ecb"
version = "0.1.0"
description = "sciqnt FX source unit — ECB EUR-cross daily reference rates (public, no auth)"
readme = "FINDINGS.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "sciqnt-schema @ git+https://github.com/sciqnt/sq-schema@v0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

